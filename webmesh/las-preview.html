<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LAS Point Cloud Preview</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f4f6f3;
        --muted: #aab4ad;
        --panel: rgba(14, 17, 16, 0.86);
        --line: rgba(244, 246, 243, 0.16);
        --accent: #6dd6a4;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0d1110;
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #scene {
        position: fixed;
        inset: 0;
      }

      .toolbar,
      .status {
        position: fixed;
        z-index: 2;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        backdrop-filter: blur(14px);
      }

      .toolbar {
        top: 14px;
        left: 14px;
        right: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 48px;
        padding: 8px;
      }

      .title {
        min-width: 0;
        padding: 0 8px;
      }

      .title strong,
      .status strong {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 14px;
      }

      .title span,
      .status span {
        color: var(--muted);
        font-size: 12px;
      }

      .actions {
        display: flex;
        flex: 0 0 auto;
        gap: 6px;
      }

      button,
      input[type="range"] {
        accent-color: var(--accent);
      }

      button {
        min-width: 42px;
        height: 32px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: rgba(244, 246, 243, 0.08);
        color: var(--ink);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      button:hover {
        border-color: rgba(109, 214, 164, 0.7);
        background: rgba(109, 214, 164, 0.14);
      }

      .status {
        left: 14px;
        bottom: 14px;
        display: grid;
        gap: 4px;
        max-width: min(540px, calc(100vw - 28px));
        padding: 10px 12px;
      }

      .status[data-state="ready"] strong {
        color: var(--accent);
      }

      .size-control {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
      }

      @media (max-width: 720px) {
        .toolbar {
          align-items: stretch;
          flex-direction: column;
        }

        .actions {
          width: 100%;
        }

        button {
          flex: 1 1 0;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div class="toolbar">
      <div class="title">
        <strong id="previewTitle">LAS Point Cloud</strong>
        <span id="subtitle">LAS sampled local preview</span>
      </div>
      <div class="actions">
        <button id="resetBtn" type="button">Reset</button>
        <label class="size-control">
          Size
          <input id="sizeInput" type="range" min="1" max="8" step="0.5" value="2.5" />
        </label>
      </div>
    </div>

    <div id="status" class="status" data-state="loading">
      <strong>Loading LAS preview</strong>
      <span id="statusText">Preparing viewer...</span>
    </div>

    <script src="./vendor/libs/three.js/build/three.min.js"></script>
    <script src="./vendor/libs/three.js/controls/OrbitControls.js"></script>
    <script src="./js/las-preview-viewer.js?v=4"></script>
  </body>
</html>
